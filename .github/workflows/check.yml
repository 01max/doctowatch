name: Check Doctolib Availability

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force notification even if slots are unchanged'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    concurrency:
      group: doctowatch-check
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download previous report
        uses: dawidd6/action-download-artifact@v24
        with:
          name: report
          path: tmp/previous
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Prepare check inputs
        env:
          DOCTOWATCH_CONFIG: ${{ secrets.DOCTOWATCH_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          umask 077
          printf '%s\n' "$DOCTOWATCH_CONFIG" > config.yml
          mkdir -p tmp/previous
          if [ ! -f tmp/previous/report.json ]; then
            printf '{"watches":[]}\n' > tmp/previous/report.json
          fi
          python3 - <<'PY'
          import os
          import shlex

          with open('tmp/.github-check-env', 'w', encoding='utf-8') as output:
              for name in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_DEFAULT_CHAT_ID', 'FORCE_NOTIFY'):
                  output.write(f'export {name}={shlex.quote(os.environ.get(name, ""))}\n')
          PY

      - name: Configure SSH
        env:
          ALWAYSDATA_SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_PRIVATE_KEY }}
        run: |
          test -n "$ALWAYSDATA_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ALWAYSDATA_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cp .github/ssh/alwaysdata_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Send check inputs to Alwaysdata
        run: |
          ssh -o BatchMode=yes doctowatch@ssh-doctowatch.alwaysdata.net \
            'mkdir -p /home/doctowatch/doctowatch/tmp/previous'
          scp -o BatchMode=yes config.yml \
            doctowatch@ssh-doctowatch.alwaysdata.net:/home/doctowatch/doctowatch/config.yml
          scp -o BatchMode=yes tmp/previous/report.json \
            doctowatch@ssh-doctowatch.alwaysdata.net:/home/doctowatch/doctowatch/tmp/previous/report.json
          scp -o BatchMode=yes tmp/.github-check-env bin/check_on_alwaysdata \
            doctowatch@ssh-doctowatch.alwaysdata.net:/home/doctowatch/doctowatch/tmp/

      - name: Run availability check
        run: |
          status=0
          ssh -o BatchMode=yes doctowatch@ssh-doctowatch.alwaysdata.net \
            "bash /home/doctowatch/doctowatch/tmp/check_on_alwaysdata $GITHUB_RUN_ID" || status=$?
          scp -o BatchMode=yes \
            "doctowatch@ssh-doctowatch.alwaysdata.net:/home/doctowatch/doctowatch/tmp/report-$GITHUB_RUN_ID.json" \
            tmp/report.json || status=1
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: tmp/report.json
          retention-days: 7

      - name: Disable workflow after 3 consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(gh run list --workflow=check.yml --limit=3 --json conclusion --jq '[.[].conclusion]')
          if [ "$recent" = '["failure","failure","failure"]' ]; then
            echo "3 consecutive failures — disabling workflow"
            gh workflow disable check.yml
          fi
